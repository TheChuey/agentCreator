<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
        }

        .topbar {
            height: 52px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: #252526;
            border-bottom: 1px solid #3f3f46;
        }

        .title {
            font-weight: bold;
            margin-right: 4px;
        }

        #projectName {
            color: #4fc3f7;
            margin-right: 12px;
            font-weight: bold;
        }

        .spacer {
            flex: 1;
        }

        /* Home for this page's own tools; empty on pages that have none. */
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button {
            border: 1px solid #555;
            background: #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button.primary {
            background: #0e639c;
            border-color: #1177bb;
        }

        button.danger {
            background: #7f1d1d;
        }

        .workspace {
            display: flex;
            height: calc(100vh - 78px);
            width: 100%;
        }

        .sidebar {
            width: 280px;
            min-width: 180px;
            background: #252526;
            border-right: 1px solid #3f3f46;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid #3f3f46;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resize-handle {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
        }

        .resize-handle:hover {
            background: #0e639c;
        }

        .tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        /* ---- Browser root folders ---- */
        .tree-item.root {
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .tree-item.root.active {
            color: #e5e7eb;
        }

        .tree-item.root.readonly .label {
            color: #6b7280;
        }

        .root-lock {
            margin-left: auto;
            font-size: 11px;
            opacity: 0.7;
        }

        .tree-item.readonly {
            opacity: 0.6;
        }

        .tree-item {
            user-select: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .tree-item:hover {
            background: #2a2d2e;
        }

        .tree-item.selected {
            background: #094771;
        }

        .tree-item.folder {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tree-item.folder .toggle {
            display: inline-block;
            width: 12px;
            font-size: 11px;
            color: #bbb;
            text-align: center;
            flex-shrink: 0;
        }

        .tree-item.folder .label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .children {
            margin-left: 12px;
        }

        .children.collapsed {
            display: none;
        }

        /* ---- Home landing panel (the editor lives on editor.html) ---- */
        .home-panel {
            flex: 1;
            min-width: 0;
            height: 100%;
            overflow-y: auto;
            padding: 40px 32px 48px;
            background: #1e1e1e;
        }

        .home-inner {
            max-width: 1080px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .home-title {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .home-subtitle {
            margin: 8px 0 28px;
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
        }

        .agent-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            width: 100%;
        }

        .agent-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            text-align: left;
            padding: 14px;
            background: #252526;
            border: 1px solid #3f3f46;
            border-left: 4px solid var(--agent-color, #4fc3f7);
            border-radius: 6px;
            cursor: pointer;
            color: #fff;
        }

        .agent-card:hover {
            background: color-mix(in srgb, var(--agent-color, #4fc3f7) 14%, #252526);
            border-color: var(--agent-color, #4fc3f7);
        }

        .agent-card:focus-visible {
            outline: 2px solid var(--agent-color, #4fc3f7);
            outline-offset: 2px;
        }

        .agent-card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .agent-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            background: var(--agent-color, #4fc3f7);
            box-shadow: 0 0 6px var(--agent-color, #4fc3f7);
        }

        .agent-card-name {
            font-weight: bold;
            font-size: 14px;
        }

        .agent-card-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .agent-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid #4b4b4b;
            color: #cbd5e1;
        }

        .agent-badge.mode {
            border-color: var(--agent-color, #4fc3f7);
            color: var(--agent-color, #4fc3f7);
        }

        .agent-card-desc {
            margin: 0;
            font-size: 12px;
            line-height: 1.5;
            color: #b6b6b6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .agent-cards-empty {
            grid-column: 1 / -1;
            color: #9ca3af;
            font-size: 13px;
            text-align: center;
            padding: 24px 0;
        }

        .statusbar {
            height: 26px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: #007acc;
            color: white;
            font-size: 12px;
        }

        .status-message {
            flex: 1;
        }
    </style>
</head>
<body>

<div class="topbar" data-pm-header>
    <div class="title">Project Manager</div>
    <span id="projectName">.</span>

    <!-- Home has no page-specific tools yet. Buttons that belong to
         this page go here so the nav keeps its place at the far right. -->
    <div class="topbar-actions" id="pageActions"></div>

    <div class="spacer"></div>
</div>


<div class="workspace">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>FOLDERS</span>
        </div>

        <div id="tree" class="tree">Loading...</div>
    </div>

    <div class="resize-handle" id="resizeHandle"></div>

    <div class="home-panel">
        <div class="home-inner">
            <h1 class="home-title">Home</h1>
            <p class="home-subtitle">Choose an agent to start a conversation.</p>
            <div id="agentCards" class="agent-cards">Loading agents...</div>
        </div>
    </div>
</div>

<div class="statusbar">
    <div id="statusMessage" class="status-message">Initializing...</div>
</div>

<script type="module" src="/static/js/main.js"></script>

</body>
</html>
